
services:
  api:
    build:
      context: ./api
    image: hcgateway-api:local
    ports:
      - "6644:6644"
    env_file:
      - ./api/.env
    container_name: hcgateway_api
    restart: unless-stopped
    volumes:
      - ./api/service-account.json:/app/service-account.json
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://127.0.0.1:6644/health', timeout=3).raise_for_status()"]
      interval: 15s
      timeout: 5s
      retries: 5

  analytics-worker:
    build:
      context: ./api
    image: hcgateway-api:local
    command: ["python", "-m", "analytics_engine.worker"]
    env_file:
      - ./api/.env
    container_name: hcgateway_analytics_worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  calendar-worker:
    build:
      context: ./api
    image: hcgateway-api:local
    command: ["python", "-m", "analytics_engine.calendar_worker"]
    env_file:
      - ./api/.env
    environment:
      # Keep the calendar credential in the root Compose .env so it is exposed
      # only to this service, not to the API or analytics worker.
      FLUIDCALENDAR_API_KEY: ${FLUIDCALENDAR_API_KEY:?Set FLUIDCALENDAR_API_KEY in the root .env file}
      FLUIDCALENDAR_BASE_URL: ${FLUIDCALENDAR_BASE_URL:?Set FLUIDCALENDAR_BASE_URL in the root .env file}
      CALENDAR_SLEEP_USER_ID: ${CALENDAR_SLEEP_USER_ID:?Set CALENDAR_SLEEP_USER_ID in the root .env file}
      CALENDAR_SLEEP_FEED_ID: ${CALENDAR_SLEEP_FEED_ID:-e50d0983-a930-40a2-a603-3336a8aab552}
      CALENDAR_SLEEP_INITIAL_LOOKBACK_DAYS: ${CALENDAR_SLEEP_INITIAL_LOOKBACK_DAYS:-7}
      CALENDAR_SLEEP_POLL_SECONDS: ${CALENDAR_SLEEP_POLL_SECONDS:-300}
      CALENDAR_SLEEP_BACKFILL_ENABLED: ${CALENDAR_SLEEP_BACKFILL_ENABLED:-false}
      CALENDAR_SLEEP_BACKFILL_BATCH_DAYS: ${CALENDAR_SLEEP_BACKFILL_BATCH_DAYS:-7}
      CALENDAR_SLEEP_BACKFILL_INTERVAL_SECONDS: ${CALENDAR_SLEEP_BACKFILL_INTERVAL_SECONDS:-86400}
    container_name: hcgateway_calendar_worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  db:
    # Current MongoDB builds refuse this host's affected 7.0.2 kernel. Pin the
    # previously deployed image and re-enable glibc rseq to avoid the TCMalloc
    # crash tracked by SERVER-121912. Upgrade the host kernel as soon as able.
    image: mongo:8.0.8@sha256:2c5f154f4e47ef5008c53ff0c9006b6f5c7d6b119c96015aba4136c50ef48b98
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - ./db:/data/db
    container_name: hcgateway_db
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?Set MONGO_INITDB_ROOT_PASSWORD in the root .env file}
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'quit(db.adminCommand({ ping: 1 }).ok ? 0 : 2)'"]
      interval: 10s
      timeout: 5s
      retries: 10
